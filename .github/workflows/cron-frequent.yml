name: COP scheduled tasks — frequent

# Independent scheduler. Vercel's own cron scheduler stopped firing, so this
# workflow pings the every-few-minutes endpoints on a schedule instead.
# Runs every 15 minutes.
#
# Both endpoints treat a plain GET as an authorised cron call, so no secret
# is needed here.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

# Don't pile up runs if one is slow.
concurrency:
  group: cop-cron-frequent
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Process email queue
        run: curl -fsS --max-time 90 "https://co-ownership-property.com/api/process-email-queue" || true
      - name: Process gallery follow-ups
        run: curl -fsS --max-time 90 "https://co-ownership-property.com/api/process-gallery-followups" || true
      - name: Run email engine
        run: curl -fsS --max-time 90 "https://co-ownership-property.com/api/email-engine" || true
